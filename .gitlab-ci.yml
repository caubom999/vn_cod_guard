deploy_cloudflare:
  stage: deploy
  image: node:22-bookworm-slim
  services:
    - name: docker:27-dind
      command: ['--tls=false']
  needs:
    - test
  resource_group: production
  environment:
    name: production
    url: https://vtjr.online
  before_script:
    - test -n "$CLOUDFLARE_API_TOKEN"
    - npm install -g wrangler@4.123.0
    - npx wrangler --version
  script:
    - npx wrangler deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  allow_failure: false

release_shopify:
  stage: release
  image: node:22-bookworm-slim
  needs:
    - deploy_cloudflare
  resource_group: shopify-production
  before_script:
    - test -n "$SHOPIFY_APP_AUTOMATION_TOKEN"
    - npm ci --prefer-offline --no-audit
    - npx --no-install shopify version
  script:
    - npx --no-install shopify app deploy --config production --allow-updates --source-control-url "$CI_PROJECT_URL/-/commit/$CI_COMMIT_SHA"
  environment:
    name: shopify-production
    url: https://dev.shopify.com/dashboard
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  allow_failure: false