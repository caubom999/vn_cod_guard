workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never

# stages:
#   - test
#   - build
#   - deploy
#   - release

stages:
  - test
  - deploy
  - release

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ''
  DOCKER_DRIVER: overlay2
  DOCKER_BUILDKIT: '1'
  NPM_CONFIG_CACHE: '$CI_PROJECT_DIR/.npm'
  PRODUCTION_URL: 'https://vtjr.online'
  VITE_CDN_URL: '/'
  VITE_HOST: 'https://vtjr.online'
  SHOPIFY_APP_PROXY: '/apps/vn-cod-guard'

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

test:
  stage: test
  image: node:22-bookworm-slim
  before_script:
    - npm ci --prefer-offline --no-audit
  script:
    - npm test --workspace hide-cod-delivery -- --run
    - npm test --workspace hide-cod-payment -- --run
    - npx prisma generate --schema web/prisma/schema.prisma
    - npm test --workspace vn-cod-guard-web -- --runInBand --passWithNoTests
    - npm run build --workspace vn-cod-guard-web
    - npm run build --workspace vn-cod-guard-frontend

