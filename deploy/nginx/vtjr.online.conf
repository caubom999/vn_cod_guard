# Install this file as /etc/nginx/sites-available/vtjr.online after confirming
# that the certificate paths match the SSL setup already present on the server.

server {
    listen 80;
    listen [::]:80;
    server_name vtjr.online www.vtjr.online;

    return 301 https://vtjr.online$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vtjr.online;

    ssl_certificate /etc/letsencrypt/live/vtjr.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vtjr.online/privkey.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.vtjr.online;

    ssl_certificate /etc/letsencrypt/live/vtjr.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vtjr.online/privkey.pem;

    return 301 https://vtjr.online$request_uri;
}
