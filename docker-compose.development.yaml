services:
  app:
    container_name: vn-cod-guard-app
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODE: production
        SHOPIFY_API_KEY: ${SHOPIFY_API_KEY}
        VITE_CDN_URL: ${VITE_CDN_URL}
        SHOPIFY_APP_PROXY: ${SHOPIFY_APP_PROXY}
        VITE_HOST: ${VITE_HOST}
        VITE_EMBEDDED_ID: ${VITE_EMBEDDED_ID}
    ports:
      - "8080:8080"
    volumes:
      - ./web:/vn-cod-guard
    environment:
      - VITE_APP_SHOPIFY_API_KEY=${SHOPIFY_API_KEY}
      - VITE_CDN_URL=${VITE_CDN_URL}
      - VITE_HOST=${VITE_HOST}
      - VITE_EMBEDDED_ID=${VITE_EMBEDDED_ID}
      - VITE_SHOPIFY_APP_PROXY=${SHOPIFY_APP_PROXY}
      - SHOPIFY_APP_PROXY=${SHOPIFY_APP_PROXY}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DATABASE=${REDIS_DATABASE:-0}
      - SHOPIFY_SESSION_STORAGE=${SHOPIFY_SESSION_STORAGE:-redis}
      - SHOPIFY_SESSION_REDIS_KEY_PREFIX=${SHOPIFY_SESSION_REDIS_KEY_PREFIX:-shopify_sessions}
      - COD_AUTOMATION_WORKER_ENABLED=${COD_AUTOMATION_WORKER_ENABLED:-true}
      - COD_AUTOMATION_WORKER_INTERVAL_MS=${COD_AUTOMATION_WORKER_INTERVAL_MS:-30000}
      - COD_AUTOMATION_WORKER_BATCH_SIZE=${COD_AUTOMATION_WORKER_BATCH_SIZE:-10}
      - COD_AUTOMATION_WORKER_MAX_ATTEMPTS=${COD_AUTOMATION_WORKER_MAX_ATTEMPTS:-3}
      - COD_AUTOMATION_WORKER_STALE_RUNNING_MS=${COD_AUTOMATION_WORKER_STALE_RUNNING_MS:-600000}
      - COD_AUTOMATION_WORKER_RETRY_BASE_MS=${COD_AUTOMATION_WORKER_RETRY_BASE_MS:-60000}
      - COD_AUTOMATION_WORKER_RETRY_MAX_MS=${COD_AUTOMATION_WORKER_RETRY_MAX_MS:-900000}
    restart: always
    depends_on:
      - mysql
      - redis
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_APP_USER}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3309}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always

  redis:
    container_name: redis
    image: redis:6.2.3-alpine
    volumes:
      - redis_data:/data
    environment:
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - ALLOW_EMPTY_PASSWORD=yes
    command: redis-server --requirepass ${REDIS_PASSWORD} --port ${REDIS_PORT} --protected-mode yes
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    restart: "always"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  mysql_data:
  redis_data:
