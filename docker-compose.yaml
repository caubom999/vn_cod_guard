services:
  app:
    container_name: vn-cod-guard-app
    image: ${APP_IMAGE:-vn-cod-guard-app:latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODE: production
        SHOPIFY_API_KEY: ${SHOPIFY_API_KEY}
        VITE_CDN_URL: ${VITE_CDN_URL:-/}
        SHOPIFY_APP_PROXY: ${SHOPIFY_APP_PROXY:-/apps/vn-cod-guard}
        VITE_HOST: ${VITE_HOST:-${HOST:-http://localhost:8080}}
        VITE_EMBEDDED_ID: ${VITE_EMBEDDED_ID:-}
    ports:
      - '${APP_PORT:-8080}:8080'
    environment:
      NODE_ENV: production
      PORT: 8080
      HOST: ${HOST:-http://localhost:8080}
      APP_SCHEME: ${APP_SCHEME:-https}
      SHOPIFY_API_KEY: ${SHOPIFY_API_KEY}
      SHOPIFY_API_SECRET: ${SHOPIFY_API_SECRET}
      SHOPIFY_SCOPES: ${SHOPIFY_SCOPES:-read_products,read_orders,write_orders}
      DATABASE_URL: mysql://${MYSQL_APP_USER}:${MYSQL_APP_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_APP_USER}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: always
    depends_on:
      - mysql
      - redis

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_APP_USER}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD}
    ports:
      - '${MYSQL_PORT:-3309}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always

  redis:
    container_name: redis
    image: redis:6.2.3-alpine
    volumes:
      - redis_data:/data
    environment:
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - ALLOW_EMPTY_PASSWORD=yes
    command: redis-server --requirepass ${REDIS_PASSWORD} --port ${REDIS_PORT} --protected-mode yes
    ports:
      - '${REDIS_PORT}:${REDIS_PORT}'
    restart: 'always'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  mysql_data:
  redis_data:
