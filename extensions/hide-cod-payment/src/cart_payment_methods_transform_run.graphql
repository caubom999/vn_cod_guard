query CartPaymentMethodsTransformRunInput(
  $hideCustomerTags: [String!] = []
  $requireCustomerTags: [String!] = []
  $hideCollectionIds: [ID!] = []
  $requireCollectionIds: [ID!] = []
) {
  cart {
    cost {
      totalAmount {
        amount
      }
    }
    buyerIdentity {
      email
      phone
      customer {
        hideTagMatch: hasAnyTag(tags: $hideCustomerTags)
        requireTagMatch: hasAnyTag(tags: $requireCustomerTags)
      }
    }
    lines {
      discountAllocations {
        discountedAmount {
          amount
        }
      }
      merchandise {
        ... on ProductVariant {
          product {
            id
            vendor
            isGiftCard
            hideCollectionMatch: inAnyCollection(ids: $hideCollectionIds)
            requireCollectionMatch: inAnyCollection(ids: $requireCollectionIds)
          }
        }
      }
    }
    deliveryGroups {
      deliveryAddress {
        countryCode
        provinceCode
        zip
      }
      selectedDeliveryOption {
        title
        code
        deliveryMethodType
      }
    }
  }
  paymentMethods {
    id
    name
  }
  paymentCustomization {
    metafield(
      namespace: "$app:hide-cod-payment"
      key: "function-configuration"
    ) {
      jsonValue
    }
  }
}
