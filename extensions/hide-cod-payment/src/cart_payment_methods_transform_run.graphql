query CartPaymentMethodsTransformRunInput {
  cart {
    cost {
      totalAmount {
        amount
      }
    }
  }
  paymentMethods {
    id
    name
  }
  paymentCustomization {
    metafield(
      namespace: "$app:hide-cod-payment"
      key: "function-configuration"
    ) {
      jsonValue
    }
  }
}
